<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>港硕这一年 v3 · 轻松版</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#24271f;color:#4b3428;font-family:system-ui,sans-serif}body{display:flex;align-items:center;justify-content:center}#frame{position:relative;width:100vw;height:100vh}canvas{width:100%;height:100%;display:block;outline:none}#loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;background:linear-gradient(#f3c9a2,#c98f74);font-size:20px;gap:20px}h1{font-size:42px;margin:0}#track{width:260px;height:6px;border-radius:3px;background:#fbf4e6;overflow:hidden}#bar{height:100%;width:0;background:#b5473b}small{color:#6b4434;font-size:14px}#error{max-width:650px;white-space:pre-wrap;padding:25px;color:#ab5848}</style></head><body><div id="frame"><canvas id="unity-canvas" tabindex="0"></canvas><div id="loading"><small>HONG KONG, ONE YEAR</small><h1>港硕这一年</h1><span id="status">拖着行李箱，正在出发…</span><div id="track"><div id="bar"></div></div><small>v3.0.0 · 轻松版四轮样例 · 本地单机体验，无需联网</small><div id="error"></div></div></div><script>const loader=document.createElement('script');loader.src='Build/{{{ LOADER_FILENAME }}}';loader.onload=()=>createUnityInstance(document.querySelector('#unity-canvas'),{dataUrl:'Build/{{{ DATA_FILENAME }}}',frameworkUrl:'Build/{{{ FRAMEWORK_FILENAME }}}',codeUrl:'Build/{{{ CODE_FILENAME }}}',streamingAssetsUrl:'StreamingAssets',companyName:'{{{ COMPANY_NAME }}}',productName:'{{{ PRODUCT_NAME }}}',productVersion:'{{{ PRODUCT_VERSION }}}'},p=>{document.querySelector('#bar').style.width=(p*100)+'%';document.querySelector('#status').textContent='拖着行李箱，正在出发… '+Math.round(p*100)+'%'}).then(g=>{window.game=g;document.querySelector('#loading').style.display='none'}).catch(e=>{document.querySelector('#error').textContent='载入未完成，请刷新重试。\n'+e});document.body.appendChild(loader);</script></body></html>
