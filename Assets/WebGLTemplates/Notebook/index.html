<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>港硕这一年 · 学生手账</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#f6f0e4;color:#20394b;font-family:system-ui,sans-serif}body{display:flex;align-items:center;justify-content:center}#frame{position:relative;width:min(100vw,160vh);aspect-ratio:8/5;box-shadow:0 8px 70px #20394b12}canvas{width:100%;height:100%;display:block;outline:none}#loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;background:#f6f0e4;font-size:20px;gap:20px}h1{font-size:42px;margin:0}#track{width:260px;height:5px;background:#ddd7c9}#bar{height:100%;width:0;background:#c97745}small{color:#78857f;font-size:14px}#error{max-width:650px;white-space:pre-wrap;padding:25px;color:#ab5848}</style></head><body><div id="frame"><canvas id="unity-canvas" tabindex="0"></canvas><div id="loading"><small>HONG KONG, ONE YEAR</small><h1>港硕这一年</h1><span id="status">正在翻开手账…</span><div id="track"><div id="bar"></div></div><small>本地单机体验 · 游戏内容无需联网</small><div id="error"></div></div></div><script>const loader=document.createElement('script');loader.src='Build/{{{ LOADER_FILENAME }}}';loader.onload=()=>createUnityInstance(document.querySelector('#unity-canvas'),{dataUrl:'Build/{{{ DATA_FILENAME }}}',frameworkUrl:'Build/{{{ FRAMEWORK_FILENAME }}}',codeUrl:'Build/{{{ CODE_FILENAME }}}',streamingAssetsUrl:'StreamingAssets',companyName:'{{{ COMPANY_NAME }}}',productName:'{{{ PRODUCT_NAME }}}',productVersion:'{{{ PRODUCT_VERSION }}}'},p=>{document.querySelector('#bar').style.width=(p*100)+'%';document.querySelector('#status').textContent='正在翻开手账… '+Math.round(p*100)+'%'}).then(g=>{window.game=g;document.querySelector('#loading').style.display='none'}).catch(e=>{document.querySelector('#error').textContent='载入未完成，请刷新重试。\n'+e});document.body.appendChild(loader);</script></body></html>
